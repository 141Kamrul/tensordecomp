[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensordecomp"
version = "0.1.0"
description = "High-dimensional tensor decompositions and PuzzleTensor optimization library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "141Kamrul" }
]
keywords = [
    "tensor",
    "tensor-decomposition",
    "cp-decomposition",
    "tucker-decomposition",
    "hosvd",
    "tensor-train",
    "puzzle-tensor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/141Kamrul/tensordecomp"
Repository = "https://github.com/141Kamrul/tensordecomp"
Issues = "https://github.com/141Kamrul/tensordecomp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tensordecomp"]
